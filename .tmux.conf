# ~/.tmux.conf - GCP VM config for running multiple Python scripts
# Reload: tmux source-file ~/.tmux.conf

# ─── Prefix (keep as fallback) ─────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Mouse ─────────────────────────────────────────────────────
set -g mouse on

# ─── F-Key Bindings (no prefix needed, single key press) ──────
# F2  = New window (like opening a new Alacritty terminal)
# F3  = Previous window
# F4  = Next window
# F5  = Reload config
# F6  = DETACH (leave tmux, everything keeps running!)
# F7  = Split vertical (side by side)
# F8  = Split horizontal (top/bottom)
# F9  = Rename current window
# F12 = Toggle zoom (fullscreen current pane)
bind -n F2  new-window -c "#{pane_current_path}"
bind -n F3  previous-window
bind -n F4  next-window
bind -n F5  source-file ~/.tmux.conf \; display "Config reloaded!"
bind -n F6  detach-client
bind -n F7  split-window -h -c "#{pane_current_path}"
bind -n F8  split-window -v -c "#{pane_current_path}"
bind -n F9  command-prompt -I "#W" "rename-window -- '%%'"
bind -n F10 confirm-before -p "Kill this pane? (y/n)" kill-pane
bind -n F12 resize-pane -Z



# ─── Navigate Panes with Alt+Arrow (no prefix needed) ─────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D



# ─── Resize Panes with Ctrl+Arrow (no prefix needed) ──────────
bind -n C-Left  resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up    resize-pane -U 2
bind -n C-Down  resize-pane -D 2



# ─── Windows ──────────────────────────────────────────────────
# Shift+Arrow to switch windows (alternate to F3/F4)
bind -n S-Left  previous-window
bind -n S-Right next-window



# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on



# ─── SAFETY: Prevent accidental kills ─────────────────────────
# Require confirmation before killing anything
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind & confirm-before -p "Kill window? (y/n)" kill-window



# Disable Ctrl+d from closing panes (unbind EOF)
set-environment -g 'IGNOREEOF' 3



# Lock out dangerous shortcuts
unbind C-z


# ─── History & Display ─────────────────────────────────────────
set -g history-limit 50000
set -g display-time 3000
set -g display-panes-time 3000



# ─── Status Bar ────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]│"
set -g status-right "#[fg=#a6e3a1]%H:%M #[fg=#f9e2af]%d-%b #[fg=#6c7086]│ F6=detach"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "


# ─── Quality of Life ──────────────────────────────────────────
set -sg escape-time 0
setw -g monitor-activity on
set -g visual-activity off
set -g allow-rename off



# ─── Split Panes with prefix (fallback) ───────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %


