services:
  devbox:
    build: .
    container_name: yuri

    ports:
      - "127.0.0.1:69:22"

    environment:
      - SSH_PUBKEY=${SSH_PUBKEY}

    volumes:
      - ./workspace:/workspace
      - kat_home:/home/kat
      - ./.tmux.conf:/home/kat/.tmux.conf:ro

    working_dir: /workspace

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SYS_CHROOT
      - AUDIT_WRITE
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:false

    pids_limit: 512
    cpus: 8
    mem_limit: 12g

    tmpfs:
      - /tmp:exec

    stdin_open: true
    tty: true

volumes:
  kat_home:
